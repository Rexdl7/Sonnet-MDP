<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sonnetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033"/>
      <stop offset="50%" stop-color="#FA2D48"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <linearGradient id="sonnetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA2D48" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF9900" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#0B0E14" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="30" fill="url(#sonnetGlow)" filter="url(#glow)"/>
  
  <!-- Central Stylized S-Wave Form -->
  <path d="M 28 36 C 28 25, 42 22, 53 22 C 67 22, 74 29, 74 38 C 74 48, 62 50, 48 54 C 36 57, 26 62, 26 71 C 26 81, 35 88, 50 88 C 65 88, 74 81, 74 72" 
        fill="none" 
        stroke="url(#sonnetGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Equalizer Pulse Bars Accent in Center -->
  <circle cx="50" cy="50" r="4.5" fill="#FFFFFF"/>
  <circle cx="34" cy="48" r="3" fill="#FA2D48"/>
  <circle cx="66" cy="52" r="3" fill="#FF7A00"/>
</svg>
